.setInt16(offset,sample<0?sample*0x8000:sample*0x7fff,true);offset+=2}return new Blob([out],{type:'audio/wav'})}async function analyzeLargeFile(file,createdAt,status){if(file.size<=MAX_DIRECT)return [await analyzeBlob(file,createdAt)];const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)throw Error('이 브라우저는 큰 음성 파일 분할 분석을 지원하지 않습니다. Chrome 최신 버전을 사용해 주세요.');status('큰 파일을 읽고 분석 구간을 준비하는 중입니다.');const ctx=new AudioCtx();let buffer;try{buffer=await ctx.decodeAudioData(await file.arrayBuffer())}finally{await ctx.close().catch(()=>{})}const bytesPerFrame=buffer.numberOfChannels*2,maxFrames=Math.max(1,Math.floor(CHUNK_TARGET/bytesPerFrame)),parts=[];for(let start=0;start<buffer.length;start+=maxFrames){const end=Math.min(buffer.length,start+maxFrames),chunk=encodeWav(buffer,start,end),part=Math.floor(start/maxFrames)+1,total=Math.ceil(buffer.length/maxFrames);status('큰 파일 자동 분할 분석 중 · '+part+'/'+total+' 구간');parts.push(await analyzeBlob(chunk,createdAt))}return parts}function mergeResults(parts){return{summary:parts.map(p=>text(p.summary)).filter(Boolean).map((v,i)=>'구간 '+(i+1)+'\n'+v).join('\n\n'),transcript:parts.map((p,i)=>'[구간 '+(i+1)+']\n'+text(p.transcript)).filter(Boolean).join('\n\n'),decisions:[...new Set(parts.flatMap(p=>Array.isArray(p.decisions)?p.decisions.map(text):[]).filter(Boolean))],tasks:parts.flatMap(p=>Array.isArray(p.tasks)?p.tasks:[])}}function renderResult(result,title,target){target.replaceChildren();const h=document.createElement('h4');h.textContent=title+' 분석 결과';target.append(h);const summary=document.createElement('p');summary.textContent='핵심 요약\n'+text(result.summary||'요약 없음');target.append(summary);if(Array.isArray(result.tasks)&&result.tasks.length){const th=document.createElement('strong');th.textContent='할 일 '+result.tasks.length+'개';target.append(th);const ul=document.createElement('ul');ul.className='record-upload-tasks';result.tasks.forEach(t=>{const li=document.createElement('li');li.className='record-upload-task';li.textContent=text(t.title||'할 일')+' · 담당: '+text(t.owner||'확인 필요')+' · 기한: '+text(t.dueDate||'확인 필요');ul.append(li)});target.append(ul)}if(Array.isArray(result.decisions)&&result.decisions.length){const d=document.createElement('p');d.textContent='결정 사항\n'+result.decisions.map(text).join('\n');target.append(d)}const details=document.createElement('details');const sum=document.createElement('summary');sum.textContent='대화 원문';const transcript=document.createElement('p');transcript.textContent=text(result.transcript||'원문 없음');details.append(sum,transcript);target.append(details)}function init(){const panel=document.getElementById('panel-record'),card=panel?.querySelector('.record-card');if(!panel||!card||document.getElementById('record-file-upload'))return false;const box=document.createElement('section');box.id='record-upload-box';box.innerHTML='<h3>음성 파일 분석</h3><small class="record-upload-help">MP3, M4A, WAV, WEBM, OGG 등 음성 파일을 선택하세요. 최대 200MB까지 지원하며 25MB 초과 파일은 자동으로 나눠 분석합니다.</small><div class="record-upload-row"><input id="record-file-upload" type="file" accept="audio/*,.mp3,.m4a,.wav,.webm,.ogg,.mp4"><button id="record-file-analyze" type="button" disabled>파일 분석</button></div><p id="record-upload-status" role="status">분석할 음성 파일을 선택하세요.</p><div id="record-upload-result" hidden></div>';card.append(box);const input=box.querySelector('#record-file-upload'),button=box.querySelector('#record-file-analyze'),statusEl=box.querySelector('#record-upload-status'),resultBox=box.querySelector('#record-upload-result');let selected=null;input.addEventListener('change',()=>{selected=input.files?.[0]||null;button.disabled=!selected;statusEl.textContent=selected?selected.name+' 선택됨 · 분석 버튼을 눌러주세요.':'분석할 음성 파일을 선택하세요.';resultBox.hidden=true});button.addEventListener('click',async()=>{if(!selected)return;if(selected.size>MAX_TOTAL){statusEl.textContent='파일이 200MB보다 큽니다. 더 짧게 나눠 주세요.';return}const consent=document.getElementById('record-consent');if(consent&&!consent.checked){statusEl.textContent='먼저 대화 참여자의 녹음 동의를 확인해 주세요.';return}button.disabled=true;statusEl.textContent='음성을 분석하는 중입니다. 큰 파일은 자동으로 여러 구간으로 나눕니다.';try{const createdAt=Date.now(),title=document.getElementById('record-title')?.value.trim()||selected.name.replace(/\.[^.]+$/,'')||'업로드 녹음',parts=await analyzeLargeFile(selected,createdAt,msg=>{statusEl.textContent=msg}),data=parts.length===1?parts[0]:mergeResults(parts),record={id:'upload-'+createdAt.toString(36)+Math.random().toString(36).slice(2),title,createdAt,duration:0,blob:selected,result:data,source:'file-upload'};await saveRecord(record);if(window.TaskStore?.addFromRecording)window.TaskStore.addFromRecording(record);document.dispatchEvent(new CustomEvent('create-ai-memo',{detail:{title:title+' 요약',body:'핵심 요약\n'+text(data.summary||'')+'\n\n결정 사항\n'+(Array.isArray(data.decisions)?data.decisions.map(text).join('\n'):'')+'\n\n대화 원문\n'+text(data.transcript||'')}}));renderResult(data,title,resultBox);resultBox.hidden=false;statusEl.textContent=(parts.length>1?parts.length+'개 구간을 ':'')+'분석 완료 · 오른쪽 할 일 목록과 메모에 결과를 저장했습니다.'}catch(e){statusEl.textContent='파일 분석 실패: '+e.message+' · API 키와 서버 상태를 확인해 주세요.'}finally{button.disabled=!selected}});return true}if(!init()){const observer=new MutationObserver(()=>{if(init())observer.disconnect()});observer.observe(document.body,{childList:true,subtree:true})}})();
</script>

<script id="aside-mobile-install-v1">(()=>{const header=document.querySelector('main>header>div');if(!header||document.getElementById('aside-mobile-install-button'))return;let installPrompt=null;const button=document.createElement('button');button.id='aside-mobile-install-button';button.type='button';button.textContent='휴대폰 앱 설치';button.setAttribute('aria-label','휴대폰에 메모장 앱 설치');button.title='웹앱을 휴대폰 홈 화면에 추가합니다. APK가 아닙니다.';const installed=()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;const hideButton=()=>{button.hidden=true;try{localStorage.setItem('aside-pwa-install-done-v1','1')}catch(e){}};if(installed())hideButton();window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;button.hidden=installed()});window.addEventListener('appinstalled',hideButton);const guide=document.createElement('dialog');guide.id='aside-mobile-install-guide';guide.innerHTML='<h2>휴대폰에 설치하기</h2><p id="aside-mobile-install-copy"></p><button type="button" id="aside-mobile-install-close">확인</button>';document.body.append(guide);guide.querySelector('#aside-mobile-install-close').addEventListener('click',()=>guide.close());guide.addEventListener('click',event=>{if(event.target===guide)guide.close()});button.addEventListener('click',async()=>{if(installed()){hideButton();return}if(installPrompt){await installPrompt.prompt();const choice=await installPrompt.userChoice;installPrompt=null;if(choice?.outcome==='accepted')hideButton();return}const text=guide.querySelector('#aside-mobile-install-copy');if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){text.textContent='Safari에서 공유 버튼을 누르고 “홈 화면에 추가”를 선택한 뒤 추가하세요. 홈 화면에서 메모장을 열면 설치 버튼은 사라집니다.'}else if(/SamsungBrowser/i.test(navigator.userAgent)){text.textContent='삼성 인터넷 메뉴(≡ 또는 ⋮)를 열고 “현재 페이지 추가” 또는 “홈 화면에 추가”를 선택하세요. 설치 후 홈 화면 아이콘으로 열면 이 버튼은 사라집니다.'}else{text.textContent='Chrome 메뉴(⋮)에서 “앱 설치” 또는 “홈 화면에 추가”를 선택하세요. 설치가 끝나면 홈 화면 아이콘으로 열 때 설치 버튼이 사라집니다. 이 앱은 PWA이며 APK가 아닙니다.'}if(typeof guide.showModal==='function')guide.showModal();else alert(text.textContent)});header.prepend(button)})();</script><style id="aside-mobile-compact-v3">
