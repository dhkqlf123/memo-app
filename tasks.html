<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해야 할 일 · 입력순</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20252d;font:15px system-ui,sans-serif}main{max-width:800px;margin:24px auto;padding:20px}h1{font-size:25px;margin:0 0 8px}p,small{color:#667085;line-height:1.6}button,input,select{font:inherit;border:1px solid #d8dde5;border-radius:8px;padding:10px;background:white;color:#20252d}button{cursor:pointer}.actions,form{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}form input{flex:1;min-width:160px}form button{background:#285ee8;color:white;border-color:#285ee8}ol{list-style:none;padding:0}.task{background:white;border:1px solid #d8dde5;border-radius:10px;padding:16px;margin:12px 0}.row{display:flex;align-items:flex-start;gap:12px}.row input{margin-top:5px}.title{font-weight:600;overflow-wrap:anywhere}.number{color:#285ee8;font-size:12px}.task.done .title{text-decoration:line-through;color:#667085}.task small{display:block;overflow-wrap:anywhere}.task .actions{margin-bottom:0}.task details{margin-top:8px;overflow-wrap:anywhere}#status{font-size:13px}</style><script src="./tasks-store.js"></script><style>main{margin:0 auto;padding:16px}h1{font-size:21px}.task{padding:12px}.number{font-weight:700;font-size:16px;margin-bottom:8px;color:#285ee8}.actions{gap:6px}form input{min-width:100px}.task small{font-size:12px}</style><link rel="manifest" href="./manifest.webmanifest"></head><body><main><h1>해야 할 일</h1><p>먼저 입력된 순서대로 정리합니다. 삭제하면 남은 항목의 번호가 1번부터 다시 매겨집니다.</p><form id="task-form"><input id="new-task" aria-label="새 할 일" placeholder="새 할 일 입력" required maxlength="1000"><button type="submit">추가</button></form><div class="actions"><select id="filter" aria-label="할 일 필터"><option value="all">전체</option><option value="pending">해야 할 일</option><option value="done">완료한 일</option></select><button id="download-tasks">목록 다운로드</button><button id="refresh">새로고침</button></div><p id="status" role="status"></p><ol id="task-list" aria-label="입력순 할 일 목록"></ol></main><script>(()=>{const get=id=>document.getElementById(id),store=window.TaskStore;function render(){try{const all=store.read(),filter=get('filter').value;get('status').textContent='전체 '+all.length+'개 · 미완료 '+all.filter(t=>!t.done).length+'개 · 입력순';get('task-list').replaceChildren();let visibleNumber=0;all.forEach(t=>{if(filter==='pending'&&t.done||filter==='done'&&!t.done)return;const li=document.createElement('li');li.className='task'+(t.done?' done':'');li.dataset.id=t.id;const number=document.createElement('small');number.className='number';number.textContent=(++visibleNumber)+'번';const row=document.createElement('div');row.className='row';const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label',t.title+' 완료');check.onchange=()=>{try{store.change(t.id,{done:check.checked})}catch(e){get('status').textContent='저장 실패: '+e.message}};const title=document.createElement('span');title.className='title';title.textContent=t.title;row.append(check,title);const metadata=document.createElement('small');metadata.textContent='담당: '+(t.owner||'확인 필요')+' · 기한: '+(t.dueDate||'확인 필요')+' · 추가: '+new Date(t.createdAt).toLocaleString('ko-KR');li.append(number,row,metadata);if(t.sourceTitle){const source=document.createElement('small');source.textContent='원본 녹음: '+t.sourceTitle;li.append(source)}if(t.evidence){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='대화 근거';const text=document.createElement('p');text.textContent=t.evidence;details.append(summary,text);li.append(details)}const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent='내용 수정';edit.onclick=()=>{const v=prompt('할 일 내용을 수정하세요.',t.title);if(v?.trim())store.change(t.id,{title:v.trim()})};const remove=document.createElement('button');remove.textContent='삭제';remove.onclick=()=>{if(confirm('이 할 일을 삭제할까요?'))store.remove(t.id)};actions.append(edit,remove);li.append(actions);get('task-list').append(li)});if(!all.length){const p=document.createElement('p');p.textContent='아직 할 일이 없습니다. 직접 입력하거나 메모장에서 대화를 녹음해 자동으로 정리하세요.';get('task-list').append(p)}}catch(e){get('status').textContent='목록을 읽을 수 없습니다. 브라우저 저장소를 확인해주세요.'}}get('task-form').onsubmit=e=>{e.preventDefault();const title=get('new-task').value.trim();if(!title)return;try{store.add(title);get('new-task').value='';get('new-task').focus()}catch(e){get('status').textContent='저장 실패: '+e.message}};get('filter').onchange=render;get('refresh').onclick=render;get('download-tasks').onclick=()=>{try{const content=store.read().map((t,index)=>(index+1)+'번 '+(t.done?'[완료] ':'[미완료] ')+t.title+'\n담당: '+(t.owner||'확인 필요')+' / 기한: '+(t.dueDate||'확인 필요')).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download='해야할일-입력순.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){get('status').textContent='다운로드 실패'}};addEventListener('storage',render);document.addEventListener('tasks-updated',render);render()})();</script>









<style id="aside-clean-tasks-redesign-v1">
:root{--canvas:transparent;--surface:#fff;--ink:#20283a;--muted:#6f788b;--line:#e4e8f1;--accent:#5065df;--accent-dark:#3f51c5;--accent-soft:#eef1ff;--shadow:0 5px 16px rgba(24,36,64,.045)}
html,body{background:transparent!important;color:var(--ink)!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-size:13px!important;line-height:1.5;overflow-x:hidden}
main{max-width:none!important;margin:0!important;padding:17px!important}
h1{font-size:18px!important;letter-spacing:-.03em;margin:0 0 5px!important;font-weight:720;color:var(--ink)}
p,small{color:var(--muted)!important;line-height:1.55;font-size:12px}
#task-form{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:8px!important;margin:14px 0 12px!important}
#new-task{min-width:0!important;width:100%;padding:10px 11px!important;border:1px solid var(--line)!important;border-radius:10px!important;font:inherit}
#task-form button{padding:9px 13px!important;background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;border-radius:10px!important;font-weight:650}
.actions{display:flex;gap:6px!important;flex-wrap:wrap;margin:0 0 10px!important}
.actions select{flex:1 1 75px;min-width:70px;padding:8px!important;border:1px solid var(--line)!important;border-radius:9px!important;font:inherit}
.actions button{padding:8px 9px!important;font-size:11px!important;border:1px solid var(--line)!important;border-radius:9px!important;background:#fff!important;color:var(--ink)!important}
#status{font-size:11px!important;margin:8px 0 12px!important}
#task-list{padding:0!important;margin:0!important;list-style:none}
.task{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:12px!important;padding:12px!important;margin:9px 0!important;box-shadow:var(--shadow)!important}
.task .row{gap:9px!important}
.task .title{font-size:13px;font-weight:650;color:var(--ink)}
.task .number{font-size:11px!important;font-weight:700;color:var(--accent-dark)!important;background:var(--accent-soft);border-radius:999px;padding:2px 7px;display:inline-block}
.task small{font-size:11px!important}
.task .actions{margin:8px 0 0!important}
.task .actions button{padding:6px 8px!important}
.task details{margin-top:7px!important;font-size:12px}
.task.done{background:#fafbfe!important}
button:focus-visible,input:focus-visible,select:focus-visible{outline:none!important;border-color:#9aa8f5!important;box-shadow:0 0 0 3px rgba(80,101,223,.12)!important}
@media(max-width:300px){main{padding:12px!important}#task-form{grid-template-columns:minmax(0,1fr)}#task-form button{width:100%}.actions button{flex:1 1 auto}}

</style>
<script src="./supabase.js"></script>
<script src="./cloud-config.js"></script><script src="./cloud-sync.js"></script></body></html>
